name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint, test, assemble debug
        run: ./gradlew lint test assembleDebug koverHtmlReport --stacktrace

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/kover/

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pushpushrelay-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/
          if-no-files-found: ignore
