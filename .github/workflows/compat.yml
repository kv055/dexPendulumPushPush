name: Compat

on:
  # Scheduled nightly run disabled (compat suite never passed on CI; re-enable
  # by restoring the cron below). Manual runs still available.
  # schedule:
  #   - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      levels:
        description: "API levels (space-separated) or 'full'"
        required: false
        default: "full"

permissions:
  contents: read

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run compatibility suite
        run: . .tools/env.sh && ./compat/compat-test.sh ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.levels != 'full' && github.event.inputs.levels || '' }}

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compat-results
          path: compat/results/
          if-no-files-found: ignore
