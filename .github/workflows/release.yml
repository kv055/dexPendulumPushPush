name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dotenvx
        run: curl -sfS https://dotenvx.sh | sh

      - name: Decrypt secrets
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
        run: |
          test -n "$DOTENV_PRIVATE_KEY_PRODUCTION" || { echo "Missing secret DOTENV_PRIVATE_KEY_PRODUCTION"; exit 1; }
          cp .env.enc .env
          dotenvx decrypt -f .env

      - name: Test
        run: ./gradlew test --stacktrace

      - name: Build signed release APK
        run: |
          set -a; . ./.env; set +a
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pushpushrelay.keystore"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/pushpushrelay.keystore"
          ./gradlew assembleRelease --stacktrace

      - name: Create GitHub release with APK
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
